plugin: community.general.proxmox
# Second, standalone Proxmox server (192.168.1.125). Credentials live in the same vault as the first server,
# under the proxmox_gaming_readonly_* keys.
url: "{{ (lookup('ansible.builtin.unvault', 'inventories/group_vars/all/proxmox.yaml') | ansible.builtin.from_yaml).proxmox_gaming_readonly_url }}"
user: "{{ (lookup('ansible.builtin.unvault', 'inventories/group_vars/all/proxmox.yaml') | ansible.builtin.from_yaml).proxmox_gaming_readonly_user }}"
token_id: "{{ (lookup('ansible.builtin.unvault', 'inventories/group_vars/all/proxmox.yaml') | ansible.builtin.from_yaml).proxmox_gaming_readonly_token_id }}"
token_secret: "{{ (lookup('ansible.builtin.unvault', 'inventories/group_vars/all/proxmox.yaml') | ansible.builtin.from_yaml).proxmox_gaming_readonly_token_secret }}"
want_facts: true
validate_certs: false
want_proxmox_nodes_ansible_host: false
# Create group with a prefix based on all the tags define on LXC and VM on proxmox
keyed_groups:
  - key: proxmox_tags_parsed
    separator: ""
    prefix: group_
# Same split as the first server: LXC IP comes from net0, VM IP from ipconfig0
compose:
  ansible_host: proxmox_net0.ip.split('/')[0]
  custom_hostname: proxmox_hostname
