[inventory]
enable_plugins = community.general.proxmox, yaml

[defaults]
inventory = inventories/inventory_lxc.proxmox.yaml,inventories/inventory_qemu.proxmox.yaml,inventories/inventory_lxc.gaming.proxmox.yaml,inventories/inventory_qemu.gaming.proxmox.yaml
vault_identity_list = power_bot@~/.ansible_vault_credentials/.ansible_vault_power_bot.pass, beammp@~/.ansible_vault_credentials/.ansible_vault_beammp.pass, assetto@~/.ansible_vault_credentials/.ansible_vault_assetto.pass, enshrouded@~/.ansible_vault_credentials/.ansible_vault_enshrouded.pass, haproxy@~/.ansible_vault_credentials/.ansible_vault_haproxy.pass, pki@~/.ansible_vault_credentials/.ansible_vault_pki.pass, proxmox@~/.ansible_vault_credentials/.ansible_vault_proxmox.pass, machikiflix@~/.ansible_vault_credentials/.ansible_vault_machikiflix.pass


