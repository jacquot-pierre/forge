---
- name: Include vault variables
  ansible.builtin.include_vars:
    file: vault.yml

- name: Ensure torrent directories exists
  ansible.builtin.file:
    path: "{{ machikiflix_torrent_folder }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Back up the torrent config before a compose change
  ansible.builtin.include_tasks:
    file: roles/machikiflix/tasks/backup_config.yml
  vars:
    machikiflix_backup_stack: torrent
    machikiflix_backup_service: torrent.service
    machikiflix_backup_compose_src: docker-compose-torrent.yml.j2
    machikiflix_backup_compose_dest: "{{ machikiflix_torrent_folder }}/docker-compose.yml"
    machikiflix_backup_config_folder: "{{ machikiflix_torrent_folder }}/config"

- name: Create systemd service for torrent
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart torrent service
  loop:
    - { src: "torrent.service.j2", dest: "/etc/systemd/system/torrent.service"}
    - { src: "docker-compose-torrent.yml.j2", dest: "{{ machikiflix_torrent_folder }}/docker-compose.yml" }
