- name: Ensure media server directories exists
  ansible.builtin.file:
    path: "{{ machikiflix_media_server_folder }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Back up the media-server config before a compose change
  ansible.builtin.include_tasks:
    file: roles/machikiflix/tasks/backup_config.yml
  vars:
    machikiflix_backup_stack: media-server
    machikiflix_backup_service: media-server.service
    machikiflix_backup_compose_src: docker-compose-media-server.yml.j2
    machikiflix_backup_compose_dest: "{{ machikiflix_media_server_folder }}/docker-compose.yml"
    machikiflix_backup_config_folder: "{{ machikiflix_media_server_folder }}/config"
    # Large config (metadata, images): only keep the last backup
    machikiflix_backup_keep: 1

- name: Create systemd service for media server
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  notify: Restart media server service
  loop:
    - { src: "media-server.service.j2", dest: "/etc/systemd/system/media-server.service"}
    - { src: "docker-compose-media-server.yml.j2", dest: "{{ machikiflix_media_server_folder }}/docker-compose.yml" }
