---
# Periodic archives of a game save folder on the game VM, pulled read-only by the backup host (role backup_pull).
savegame_backup_name: enshrouded
savegame_backup_source: /opt/enshrouded/savegame
savegame_backup_dir: /var/backups/savegames

# systemd OnCalendar: every hour. Persistent: a run missed while the VM was off happens at the next boot
savegame_backup_schedule: "*:00"
# Only the most recent archives are kept, whatever their age (the VM is often off for days):
# 48 hourly archives = 2 days of play
savegame_backup_keep: 48

# Read-only SSH access for the backup host, restricted to savegame_backup_dir (rrsync -ro)
savegame_backup_user: savegame-backup
# Public key of the backup host, set by the backup.yml playbook from the backup_pull role
# savegame_backup_authorized_key:
